<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">ABC post-training benchmark architecture</title><desc id="desc">The coordinator runs one GPU under a shared time budget. Native YAM simulation supplies observations and transitions to a frozen ABC policy, a QF3 output adapter, and a ResFiT residual actor. Matched evaluation writes evidence. The dashboard reads evidence. Independent review and Jev assess code and claims. EXPO-FT and Galaxea embodiment bridges remain planned.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#76dfbd"/></marker><style>text{font-family:Arial,sans-serif;fill:#eaf0fa} .box{fill:#223449;stroke:#678098;stroke-width:2;rx:12} .planned{fill:#192638;stroke:#ddad6b;stroke-width:2;stroke-dasharray:7 5;rx:12}.line{fill:none;stroke:#76dfbd;stroke-width:2;marker-end:url(#arrow)}.hint{font-size:15px;fill:#b7c6d8}.label{font-size:20px;font-weight:bold}</style></defs>
<rect width="1200" height="650" fill="#0c1622"/><text x="40" y="45" font-size="27" font-weight="bold">ABC post-training benchmark</text><text x="40" y="73" class="hint">Solid: implemented and measured. Dashed: planned. Four updates per adaptation pilot.</text>
<rect class="box" x="40" y="110" width="300" height="100"/><text x="60" y="145" class="label">Coordinator / runner</text><text x="60" y="173" class="hint">GPU 0 · shared lock · 7,200 s limit</text><text x="60" y="196" class="hint">Pinned inputs · process cancellation</text>
<rect class="box" x="40" y="270" width="300" height="100"/><text x="60" y="307" class="label">Native YAM simulator</text><text x="60" y="335" class="hint">Bottles task · cameras · 14-D actions</text><text x="60" y="358" class="hint">Observations and executed transitions</text>
<rect class="box" x="410" y="110" width="340" height="90"/><text x="430" y="145" class="label">Frozen ABC-DiT baseline</text><text x="430" y="177" class="hint">Released checkpoint · nominal actions</text>
<rect class="box" x="410" y="225" width="340" height="90"/><text x="430" y="260" class="label">QF3 output-adapter pilot</text><text x="430" y="291" class="hint">Rank 4 · immediate-return critic</text>
<rect class="box" x="410" y="340" width="340" height="90"/><text x="430" y="375" class="label">ResFiT residual pilot</text><text x="430" y="407" class="hint">Frozen features · 10 full-action critics</text>
<rect class="box" x="840" y="160" width="320" height="120"/><text x="860" y="197" class="label">Matched evaluation</text><text x="860" y="224" class="hint">Fresh resets · same seeds and noise</text><text x="860" y="248" class="hint">8 actions per call · explicit horizon</text><text x="860" y="271" class="hint">Success · proposal latency · videos</text>
<rect class="box" x="840" y="340" width="320" height="90"/><text x="860" y="375" class="label">Receipts → read-only UI</text><text x="860" y="407" class="hint">Measured values · hashes · missing data</text>
<path class="line" d="M340 160 H405"/><path class="line" d="M340 320 H375 V155 H405"/><path class="line" d="M375 270 H405"/><path class="line" d="M375 320 V385 H405"/><path class="line" d="M750 155 H790 V200 H835"/><path class="line" d="M750 270 H790 V230 H835"/><path class="line" d="M750 385 H800 V260 H835"/><path class="line" d="M1000 280 V335"/>
<path class="line" d="M840 270 H780 V460 H200 V375"/><text x="340" y="453" class="hint">Executed action loop</text>
<rect class="planned" x="40" y="485" width="350" height="100"/><text x="60" y="523" class="label">EXPO-FT / Galaxea bridges</text><text x="60" y="552" class="hint">Async editor · delayed replay · R1 tasks</text><text x="60" y="575" class="hint">No measured EXPO-FT or R1 result</text>
<rect class="box" x="460" y="485" width="340" height="100"/><text x="480" y="523" class="label">Independent reviewer + Jev</text><text x="480" y="552" class="hint">Tests and evidence checks / advisory</text><text x="480" y="575" class="hint">Claims remain bounded by receipts</text>
<path class="line" d="M840 385 H820 V535 H805"/>
<text x="40" y="625" class="hint">The UI does not control training or robots. STE guidance used; full ASD-STE100 compliance was not checked.</text>
</svg>
